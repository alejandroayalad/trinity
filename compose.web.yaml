# Add the compiled frontend and Caddy without changing local development.
# Layer after compose.yaml and, when configured, compose.sql.yaml.
# Defaults expose the web service only through an SSH tunnel.
services:
  postgres:
    ports: !reset []
  api:
    ports: !reset []
  web:
    build: ./frontend
    image: trinity-web:${TRINITY_RELEASE:-local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Use http://:80 for a loopback-only SSH preview. Use a domain for HTTPS.
      TRINITY_SITE_ADDRESS: ${TRINITY_SITE_ADDRESS:?Set the Caddy site address}
    ports:
      - "${TRINITY_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${TRINITY_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      # Retain certificates and renewal state across image replacements.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
