[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[project]
name = "trinity"
version = "0.1.0"
description = "Backend for the Trinity nuclear outage explorer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "alembic==1.20.0",
    "sqlalchemy==2.1.3",
    "pyarrow==25.0.1",
    "datafusion==54.0.0",
    "sqlglot==30.21.0",
    "bullmq==3.3.0",
    "boto3[crt]==1.43.108",
]

[tool.uv]
required-version = "==0.12.23"
