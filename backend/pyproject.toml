[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[project]
name = "trinity"
version = "0.1.0"
description = "Backend for the Trinity nuclear outage explorer"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[tool.uv]
required-version = "==0.12.23"
